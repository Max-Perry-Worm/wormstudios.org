<script>
    async function checkPin() {
        const enteredPin = document.getElementById("pinInput").value;
        const error = document.getElementById("pinError");

        try {
            const response = await fetch("pin.txt");

            if (!response.ok) {
                throw new Error("Could not load pin.txt");
            }

            const correctPin = (await response.text()).trim();

            if (enteredPin === correctPin && correctPin.length > 0) {
                document.getElementById("pinScreen").style.display = "none";
                document.getElementById("websiteContent").style.display = "block";

                loadGames();
            } else {
                error.textContent = "Incorrect PIN. Try again.";
                error.style.display = "block";
            }
        } catch (err) {
            error.textContent = "Could not load PIN. Check pin.txt.";
            error.style.display = "block";
        }
    }

    document.getElementById("pinInput").addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            checkPin();
        }
    });

    function loadGames() {
        if (document.getElementById("gamesLoaded")) return;

        const script = document.createElement("script");
        script.id = "gamesLoaded";
        script.src = "games.js";
        document.body.appendChild(script);

        const searchScript = document.createElement("script");
        searchScript.src = "https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/searchbut.js";
        document.body.appendChild(searchScript);
    }
</script>

</body>

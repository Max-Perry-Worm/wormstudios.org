<html lang="en">

<title>Worm Extractor</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;

    color: white;
}

    flex: 1;

.browser {
    flex: 1;

.item {
    background: #30354b;

    border-radius: 8px;
    margin-bottom: 10px;
    overflow-wrap: anywhere;
}

.item button {
    margin-top: 8px;
    background: #dc475f;

    max-width: 100%;

</style>
</head>

<body>

<header>
    <h2>⚡ Worm Extractor</h2>
    <span>CONTENT LAUNCHER</span>
</header>

<div class="toolbar">
    <input id="url" placeholder="Enter website URL..." value="https://example.com">
    <button onclick="loadSite()">GO</button>
</div>

<div class="main">

    <div class="browser">
        <iframe id="browser"
            src="https://example.com"
            title="Website viewer">
        </iframe>
    </div>

    <div class="sidebar">
        <h3>🚀 Extracted Content</h3>

        <p class="empty" id="empty">
            Your launched content will appear here.
        </p>

        <div id="collection"></div>

        <button onclick="copyAll()">
            Copy All
        </button>

        <button onclick="downloadAll()">
            Download
        </button>

        <button onclick="clearAll()" style="background:#dc475f">
            Clear Collection
        </button>
    </div>

</div>

<script>
const collection = [];

function loadSite() {
    let url = document.getElementById("url").value.trim();

    if (!url) return;

    if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
    }

    try {
        const parsed = new URL(url);

        if (!["http:", "https:"].includes(parsed.protocol)) {
            throw new Error("Invalid protocol");
        }

        document.getElementById("browser").src = parsed.href;

    } catch {
        alert("Please enter a valid website URL.");
    }
}

function addContent(content, type) {
    collection.push({content, type});
    render();
}

function render() {
    const container = document.getElementById("collection");

    document.getElementById("empty").style.display =
        collection.length ? "none" : "block";

    container.innerHTML = "";

    collection.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "item";

        if (item.type === "image") {
            const img = document.createElement("img");
            img.src = item.content;
            img.alt = "Extracted image";
            div.appendChild(img);
        } else {
            const p = document.createElement("p");
            p.textContent = item.content;
            div.appendChild(p);
        }

        const remove = document.createElement("button");
        remove.textContent = "Remove";
        remove.onclick = () => {
            collection.splice(index, 1);
            render();
        };

        div.appendChild(remove);
        container.appendChild(div);
    });
}

function copyAll() {
    const text = collection.map(item =>
        item.type === "image"
            ? item.content
            : item.content
    ).join("\n\n");

    navigator.clipboard.writeText(text);
}

function downloadAll() {
    const text = collection.map(item =>
        item.type.toUpperCase() + ":\n" + item.content
    ).join("\n\n");

    const blob = new Blob([text], {type: "text/plain"});
    const link = document.createElement("a");

    link.href = URL.createObjectURL(blob);
    link.download = "extracted-content.txt";
    link.click();

    URL.revokeObjectURL(link.href);
}

function clearAll() {
    collection.length = 0;
    render();
}
</script>

</body>
</html>
